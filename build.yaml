targets:
  $default:
    builders:
      freezed:
        options:
          # 優化生成的程式碼
          union_key: 'type'
          union_value_case: FreezedUnionCase.pascal

      json_serializable:
        options:
          any_map: false
          checked: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: true
