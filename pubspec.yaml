name: tw_reporter_app
description: "報導者新聞 APP - Taiwan Reporter News Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  auto_route: ^11.1.0
  cupertino_icons: ^1.0.8  # iOS 風格圖示
  dio: ^5.7.0
  dio_cache_interceptor: ^4.0.5  # HTTP cache interceptor
  dio_compatibility_layer: ^0.1.0  # rhttp ↔ Dio 適配
  file: ^7.0.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1  # 圖片快取管理
  flutter_compositions: ^0.2.1
  flutter_html: ^3.0.0  # HTML 渲染
  flutter_inappwebview: ^6.1.0  # 內嵌 WebView（跨平台統一 API）
  flutter_local_notifications: ^20.1.0  # 本地通知
  flutter_svg: ^2.0.17  # SVG 圖片顯示
  freezed_annotation: ^3.0.0
  http_cache_file_store: ^2.0.1  # FileCacheStore 實作
  http_cache_stream: ^0.0.4  # 影片快取串流
  intl: ^0.20.2  # 日期格式化
  json_annotation: ^4.9.0
  path_provider: ^2.1.0  # 快取目錄路徑
  retrofit: ^4.9.2
  rhttp: ^0.15.1  # Rust HTTP client (HTTP/1~3)
  share_plus: ^12.0.1  # 分享功能
  shared_preferences: ^2.3.2  # 本地儲存
  unifiedpush: ^6.0.1  # UnifiedPush 推播
  url_launcher: ^6.3.1  # 外部連結
  video_player: ^2.9.2  # 原生影片播放

dev_dependencies:
  auto_route_generator: ^10.2.6
  build_runner: ^2.4.13
  flutter_compositions_lints: ^0.2.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mocktail: ^1.0.4
  retrofit_generator: ^10.2.1
  very_good_analysis: ^10.1.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/images/app_icon_macos.png"
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F80B28"
  image: "assets/images/splash_icon.png"
  android: true
  ios: true
  fullscreen: true

# Temporary workaround for Android 16KB page-size compatibility.
# PR #247: https://github.com/google/webcrypto.dart/pull/247
# Issue #239: https://github.com/google/webcrypto.dart/issues/239
# Use webcrypto branch from PR #247 to force plugin-side ndkVersion=flutter.ndkVersion.
# Pinned to commit d178309fd4b5c389656325919e71eb6dbaa6f235 to avoid branch drift.
# Remove this override after an official webcrypto release includes PR #247.
dependency_overrides:
  webcrypto:
    git:
      url: https://github.com/emersion/webcrypto.dart.git
      ref: d178309fd4b5c389656325919e71eb6dbaa6f235

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
