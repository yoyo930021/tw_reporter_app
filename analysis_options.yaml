include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.gr.dart'
    - build/**
    - .dart_tool/**
    - .fvm/**
    - research/**

  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Not a published library; doc comments on every public member is excessive
    public_member_api_docs: false
